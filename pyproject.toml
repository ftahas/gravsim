[project]
name = "gravsim"
version = "0.1.0"
description = "Solar system simulation: Newtonian gravity vs. General Relativity (pedagogical)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.6",
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "numba>=0.60",
]

[project.scripts]
# Console entry point: unlike `python -m gravsim.web`, it does not put the current directory on
# sys.path, so it also works from the project's parent folder (where the project directory
# itself would otherwise shadow the package as a namespace package named `gravsim`).
gravsim-web = "gravsim.web.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.5",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbconvert>=7",
    "rebound>=4.4",
    "reboundx>=4.4",
    "httpx>=0.27",
    "playwright>=1.45",
]
app = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gravsim*"]

[tool.setuptools.package-data]
gravsim = ["data/*.json", "data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running validation tests (deselect with -m 'not slow')",
    "network: tests that need internet access",
    "web: browser tests of the Three.js front end (need playwright + chromium)",
]
addopts = "-m 'not network and not slow and not web'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "NPY"]
