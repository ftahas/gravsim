site_name: gravsim — Newton vs. Einstein in the solar system
site_description: Theory pages, lesson index and validation results of the gravsim project.
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Overview: index.md
  - Lessons (notebooks): lessons.md
  - Interactive lab (app): app.md
  - Theory:
      - Newtonian N-body problem: theory/newton.md
      - Integrators and their errors: theory/integrators.md
      - Measuring a perihelion drift: theory/measurement.md
      - The 1PN correction and the 43 arcseconds: theory/pn1.md
      - Schwarzschild geodesics: theory/schwarzschild.md
      - The Einstein–Infeld–Hoffmann equations: theory/eih.md
      - The PPN framework (β, γ): theory/ppn.md
      - Light, deflection and the Shapiro delay: theory/light.md
  - Validation: validation.md
